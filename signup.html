<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
</head>
<body>
    <header>
        <h1 align="center">Tasty Restaurant</h1>
        <img src="logo.jpg" alt="logoimage" width="100" height="100" align="center">
    </header>
    <main>
        <h4>Sign up</h4>
        <form method="post">
            <div>
                <label for="Userfname">First Name</label><br>
                <input type="text" id="Userfname" name="Userfname" required>
            </div>
            <div>
                <label for="Userlname">Last Name</label><br>    
                <input type="text" id="Userlname" name="Userlname">
            </div>
            <div>
                <label for="useremail">Email</label><br>                    
                <input type="email" id="useremail" name="useremail" required>
            </div>
            <div>
                <label for="userpassword">Password</label><br> 
                <input type="password" id="userpassword" name="userpassword" required minlength="5" maxlength="15">
            </div>
            <div>
                <label for="userconfirmpassword">Confirm Password</label><br>
                <input type="password" id="userconfirmpassword" name="userconfirmpassword" required minlength="5" maxlength="15">
            </div>
            <div>
                <button type="submit">Sign Up</button>
            </div>
        </form>
    </main>
    
</body>
</html>
