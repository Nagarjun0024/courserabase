<body>
    <header>
        <h1 align="center">Tasty Restaurant</h1>
        <img src="logo.jpg" alt="logoimage" width="100" height="100" align="center">
    </header>
    <main>
        <h2 align="center">Login Page</h2>
        <form method="post">
            <div>
                <label for="useremail">Email</label><br>                    
                <input type="email" id="useremail" name="useremail" required>
            </div>
            <div>
                <label for="userpassword">Password</label><br> 
                <input type="password" id="userpassword" name="userpassword" required minlength="5" maxlength="15">
            </div>
            <div>
                <button type="submit">Login</button>
            </div>
            div>
                <p>Don't have an account? <a href="signup.html" target="_blank">Sign up</a></p>
            </div>

    </main>
    <footer>

    </footer>
</body>
